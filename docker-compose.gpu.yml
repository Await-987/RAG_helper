version: '3.8'

services:
  rag-app-gpu:
    build:
      context: .
      dockerfile: Dockerfile.cuda

    container_name: rag-chatbot-gpu

    ports:
      - "8501:8501"

    volumes:
      # 业务数据目录
      - ./data:/app/data
      # 用户数据目录（隐藏）
      - ./.user:/app/.user
      # 模型目录
      - ./models:/app/models
      # 环境配置
      - ./.env:/app/.env

    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONUNBUFFERED=1

    # GPU 配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped

    # 可选：资源限制
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '8'
    #       memory: 16G
    #     reservations:
    #       cpus: '4'
    #       memory: 8G
